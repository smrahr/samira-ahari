<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 900">
  <!-- yellow bg → GREEN after overlay -->
  <rect width="2000" height="900" fill="#FFFF00"/>
  <!-- black diagonal → RED after overlay -->
  <polygon points="0,0 900,0 0,900"           fill="#000000"/>
  <polygon points="2000,900 1100,900 2000,0"  fill="#000000"/>
  <!-- cyan triangle → WHITE after overlay -->
  <polygon points="0,0 500,0 0,500"           fill="#00FFFF"/>
  <polygon points="2000,900 1500,900 2000,400" fill="#00FFFF"/>
  <!-- magenta circle accent → BLUE after overlay -->
  <circle cx="1000" cy="450" r="120" fill="#FF00FF"/>
  <circle cx="1000" cy="450" r="70"  fill="#000000"/>
  <!-- black text → RED after overlay -->
  <text x="1000" y="400" font-family="Arial Black, sans-serif" font-size="110" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="-3">DEKA</text>
  <text x="1000" y="540" font-family="Arial Black, sans-serif" font-size="90" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="-2">TRACKING</text>
</svg>
